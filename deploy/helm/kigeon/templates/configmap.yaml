apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kigeon.fullname" . }}
  labels:
    {{- include "kigeon.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Values.config | toYaml | nindent 4 }}
  {{- range $name, $script := .Values.hooks }}
  {{- if eq $name "config.yaml" }}
  {{- fail "hooks: config.yaml is reserved for the kigeon configuration" }}
  {{- end }}
  {{ $name }}: |
    {{- $script | trimSuffix "\n" | nindent 4 }}
  {{- end }}
