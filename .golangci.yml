version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ninech/kigeon

issues:
  exclude-rules:
    # Unchecked errors are acceptable in tests.
    - path: _test\.go
      linters:
        - errcheck
