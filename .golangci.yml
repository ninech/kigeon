version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - thelper
    - paralleltest
  exclusions:
    rules:
      # Unchecked errors are acceptable in tests.
      - path: _test\.go
        linters:
          - errcheck
      # TestParseConfig uses t.Setenv which is incompatible with t.Parallel.
      - path: internal/eventsender/loki/factory_test.go
        linters:
          - paralleltest

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ninech/kigeon
